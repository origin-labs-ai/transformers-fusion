name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    name: "Windows / MSVC"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # Production-safe scope: PR-speed set (mirrors ci_full.yml Quick +
      # Dockerfile) — full 900s fuzz / 600s training / 300s heavies run in
      # the nightly-full-asan shards, not on every push. test_gpu stays
      # INCLUDED here: it probes hardware and falls back gracefully with no
      # GPU (tests/test_gpu.cpp:26-27), so Windows runners prove the binary.
      - name: Test
        working-directory: build
        timeout-minutes: 30
        run: >
          ctest -C Release --output-on-failure --timeout 300
          --exclude-regex "test_protected|test_training|test_native_quant|test_moe_training|test_fuzz_codec|test_paged_kv_4m"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-x64
          path: |
            build/Release/*.exe
            build/Release/*.lib
          retention-days: 14

  build-ubuntu-gcc:
    name: "Ubuntu / GCC-13"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          cmake -S . -B build-gcc
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-gcc --parallel $(nproc)

      - name: Test
        working-directory: build-gcc
        timeout-minutes: 30
        run: >
          ctest --output-on-failure --timeout 300
          --exclude-regex "test_protected|test_gpu|test_training|test_native_quant|test_moe_training|test_fuzz_codec|test_paged_kv_4m"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-gcc13
          # Single-config Make build: binaries land at the build root, test
          # binaries under build-gcc/tests/ — there is no Release/ subdir.
          path: |
            build-gcc/quant_*
            build-gcc/bench_*
            build-gcc/train_*
            build-gcc/tests/
          retention-days: 14
          include-hidden-files: false

  build-ubuntu-clang:
    name: "Ubuntu / Clang-18"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -S . -B build-clang
          -DCMAKE_BUILD_TYPE=Release
          -DQUANT_BUILD_TESTS=ON
          -DQUANT_BUILD_BENCHMARKS=OFF
          -DQUANT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build-clang --parallel $(nproc)

      - name: Test
        working-directory: build-clang
        timeout-minutes: 30
        run: >
          ctest --output-on-failure --timeout 300
          --exclude-regex "test_protected|test_gpu|test_training|test_native_quant|test_moe_training|test_fuzz_codec|test_paged_kv_4m"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-clang18
          # Single-config Make build: binaries land at the build root, test
          # binaries under build-clang/tests/ — there is no Release/ subdir.
          path: |
            build-clang/quant_*
            build-clang/bench_*
            build-clang/train_*
            build-clang/tests/
          retention-days: 14
          include-hidden-files: false
