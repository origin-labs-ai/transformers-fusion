name: CI Full

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native"
            generator: Ninja
            asan: true
            coverage: false
          - os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-march=native"
            generator: Ninja
            asan: false
            coverage: true
          - os: windows-latest
            # Plain MSVC (cl.exe via msvc-dev-cmd, no CC/CXX override).
            # A clang-cl override was tried here and failed Configure in ~2s
            # on windows-latest across runs (2026-09-13); the plain-MSVC
            # Ninja pattern is proven green by build.yml's Windows job on the
            # same image. Clang coverage stays via the clang-18 Linux leg.
            # cc/cxx stay "msvc" (not empty): the Configure step maps "msvc"
            # to UNSET env so CMake picks cl.exe from the msvc-dev-cmd PATH.
            cc: msvc
            cxx: msvc
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            generator: Ninja
            asan: false
            coverage: false
          - os: macos-latest
            cc: clang
            cxx: clang++
            # ARM-safe: NO -march=native here (Apple Silicon = arm64; x86
            # march flags are hard errors, 2026-09-13). The Configure step
            # additionally forces -DQUANT_AVX2=OFF on macOS. Mirrors
            # macos.yml's ARM-safe flags.
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            generator: Ninja
            asan: false
            coverage: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LLVM/Clang (Ubuntu)
        if: runner.os == 'Linux' && matrix.cxx == 'clang++-18'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-18 clang++-18 lld-18

      - name: Install GCC-13 (Ubuntu)
        if: runner.os == 'Linux' && matrix.cxx == 'g++-13'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cmake ninja-build lcov gcovr
          sudo apt-get install -y libc++-dev libc++abi-dev || true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja lcov || true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y || true
          pip install gcovr || true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.cc }}-
            build-${{ runner.os }}-

      - name: Configure CMake
        # bash on all three OSes (Windows default is pwsh, which cannot run
        # the POSIX conditionals below; Git Bash ships on windows-latest).
        shell: bash
        run: |
          # Compiler selection: "msvc" sentinel (Windows leg) = export
          # NOTHING so CMake picks cl.exe from the msvc-dev-cmd PATH.
          # (An empty-string CC export breaks compiler detection; an
          # explicit clang-cl broke Configure in ~2s on windows-latest.)
          if [ "${{ matrix.cc }}" != "msvc" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          # AVX2 is x86-only: force OFF on macOS (Apple Silicon ARM64) where
          # -mavx2/-mavx/-mbmi2/-mfma are hard errors (2026-09-13). Mirrors
          # macos.yml's ARM-safe flags. x86 legs keep ON for SIMD coverage.
          AVX2_FLAG="-DQUANT_AVX2=ON"
          if [ "${{ runner.os }}" = "macOS" ]; then AVX2_FLAG="-DQUANT_AVX2=OFF"; fi
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.cmake_args }} \
            -DQUANT_BUILD_TESTS=ON \
            -DQUANT_BUILD_BENCHMARKS=ON \
            -DQUANT_BUILD_TOOLS=ON \
            $AVX2_FLAG \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build

      - name: Quick tests
        timeout-minutes: 10
        # bash on all OSes: the multi-line script uses POSIX `\`
        # continuations + `--flags` which pwsh (Windows default) parses as
        # unary operators (ParserError, 2026-09-13). No-op on Linux/macOS.
        shell: bash
        run: |
          # D7 W5 aligned PR exclusion (speed only; full suite runs in nightly-full-asan, no excludes):
          # - test_protected: heavy integrity/monolith test linking many libs (300s TIMEOUT), too slow for PR gate.
          # - test_gpu: requires GPU/CUDA hardware (WIN32-only quant_gpu); no GPU on Linux CI runners.
          #   NOTE: substring also excludes test_gpu_capability (runs in nightly).
          # - test_training: long training loop (600s TIMEOUT), too slow/flaky for PR gate.
          #   NOTE: substring also excludes test_training_features (runs in nightly).
          # - test_native_quant: long training-linked quant convergence test (300s TIMEOUT), ASAN-heavy/slow.
          #   NOTE: substring also excludes test_native_quant_moe (runs in nightly).
          #   test_native_weight does NOT match this substring — it runs in PR
          #   Quick with its 300s TIMEOUT (slow but green; nightly shard 2
          #   also covers it).
          # - test_moe_training: distributed MoE training test (300s TIMEOUT), heavy/flaky, nightly only.
          # - test_paged_kv_4m: large-memory 256MiB cache test, slow/OOM-prone under sanitizers in PR.
          ctest --test-dir build --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|test_native_quant|test_moe_training|test_paged_kv_4m"

      - name: ASAN/UBSAN build (Linux GCC)
        if: runner.os == 'Linux' && matrix.asan
        timeout-minutes: 30
        shell: bash
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUANT_BUILD_TESTS=ON \
            -DQUANT_AVX2=ON
          cmake --build build-asan --parallel 2>&1
          # D7 W5 aligned PR exclusion (speed only; full suite runs in nightly-full-asan, no excludes).
          # See the Quick-tests step above for what each pattern covers
          # (test_gpu/test_training/test_native_quant are substring patterns).
          ctest --test-dir build-asan --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|test_native_quant|test_moe_training|test_paged_kv_4m" 2>&1

      - name: Code coverage (Linux Clang)
        if: runner.os == 'Linux' && matrix.coverage
        timeout-minutes: 15
        # CC/CXX MUST be clang here: the coverage flags below
        # (-fprofile-instr-generate -fcoverage-mapping) are Clang-only and
        # the runner default cc is gcc (instant configure failure, 2026-09-13).
        env:
          CC: clang-18
          CXX: clang++-18
        shell: bash
        run: |
          cmake -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DQUANT_BUILD_TESTS=ON \
            -DQUANT_AVX2=ON
          cmake --build build-cov
          # D7 W5 aligned PR exclusion (speed only; full suite runs in nightly-full-asan, no excludes).
          # See the Quick-tests step above for what each pattern covers
          # (test_gpu/test_training/test_native_quant are substring patterns).
          ctest --test-dir build-cov --output-on-failure --timeout 120 \
            --exclude-regex "test_protected|test_gpu|test_training|test_native_quant|test_moe_training|test_paged_kv_4m"
          llvm-profdata merge -sparse build-cov/**/*.profraw -o coverage.profdata 2>/dev/null || true

      - name: Performance benchmarks
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          cmake --build build --target bench_kernels 2>/dev/null || true
          if [ -f ./build/bench_kernels ]; then
            ./build/bench_kernels 2>&1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ runner.os }}-${{ matrix.cc }}
          # Binaries land at the build root (no RUNTIME_OUTPUT_DIRECTORY) and
          # test binaries under build/tests/ — build/tools/ and build/bench/
          # do not exist as output dirs (see Dockerfile P2 note).
          path: |
            build/quant_*
            build/bench_*
            build/train_*
            build/generate_comparison_visuals*
            build/tests/

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 ninja-build cmake
      - name: Run clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18" -DQUANT_BUILD_TESTS=ON -DQUANT_AVX2=ON 2>&1 | tail -20
          cmake --build build 2>&1 | head -100 || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Docker context
        run: |
          docker --version
          docker buildx version 2>/dev/null || echo "no buildx"
          ls -la Dockerfile .dockerignore 2>/dev/null || echo "no .dockerignore"
          du -sh . 2>/dev/null; df -h / | tail -1
      - name: Build Docker image
        run: |
          docker build -t transcender-cpp:ci .
      - name: Test Docker image
        run: |
          docker run --rm transcender-cpp:ci --help 2>&1 || true

  # D7 W5: nightly full ASAN+UBSAN suite — NO excludes (covers all PR-skipped patterns).
  # Sharded via `ctest -R` across matrix shards; union of shards = full suite.
  nightly-full-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            ctest_regex: "test_(tensor|math|format|kernel|model|tokenizer|ops|hybrid|debug|gle|mix|mixed|sha256|grp|fp32|backends|continual|transformer|sampler|kv_cache|autograd|optimizer|code_gen|simd|server|wave|unified|data_trust|guard|hotswap|platform)"
          - shard: 2
            ctest_regex: "test_(trainer|training|gradient|native|moe|expert|grpo|rll|rollout|fine|quant)"
          - shard: 3
            ctest_regex: "test_(gpu|cuda|inference|agi|multimodal|production|protected|paged|fuzz|ste_codebook|block_codec|all)"
      # Shard-union gate: fail loudly if any registered test matches NO shard
      # (prevents silent orphaning — 28 tests were orphaned before shard 1
      # carried the hybrid/debug/gle/mix/sha256/… alternation).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13 gcc-13

      - name: Configure ASAN full build
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build-asan-full -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUANT_BUILD_TESTS=ON \
            -DQUANT_AVX2=ON

      - name: Build ASAN full
        run: cmake --build build-asan-full

      - name: Full ASAN tests (shard ${{ matrix.shard }}/3, no excludes)
        timeout-minutes: 90
        run: |
          # No --exclude-regex here: nightly covers test_protected, test_gpu,
          # test_training, test_native_quant, test_moe_training, test_paged_kv_4m.
          ctest --test-dir build-asan-full --output-on-failure --timeout 600 \
            -R "${{ matrix.ctest_regex }}"

      - name: Shard-union gate (no orphaned tests)
        if: matrix.shard == 1
        run: |
          # Every registered ctest name must match at least one nightly shard
          # regex, else it silently never runs in CI. Prints orphans + fails.
          ctest --test-dir build-asan-full -N -R "test_|grp_proof" 2>/dev/null \
            | grep -oE "(test_[A-Za-z0-9_]+|grp_proof_test)" | sort -u > /tmp/all_tests.txt || true
          for t in $(cat /tmp/all_tests.txt); do
            if ! echo "$t" | grep -Eq "test_(tensor|math|format|kernel|model|tokenizer|ops|hybrid|debug|gle|mix|mixed|sha256|grp|fp32|backends|continual|transformer|sampler|kv_cache|autograd|optimizer|code_gen|simd|server|wave|unified|data_trust|guard|hotswap|platform)|test_(trainer|training|gradient|native|moe|expert|grpo|rll|rollout|fine|quant)|test_(gpu|cuda|inference|agi|multimodal|production|protected|paged|fuzz|ste_codebook|block_codec|all)|grp_proof_test"; then
              echo "ORPHANED TEST (matches no nightly shard): $t"
              echo "$t" >> /tmp/orphans.txt
            fi
          done
          if [ -f /tmp/orphans.txt ]; then echo "FAIL: orphaned tests exist"; cat /tmp/orphans.txt; exit 1; fi
          echo "Shard-union gate: all $(wc -l < /tmp/all_tests.txt) tests covered"
